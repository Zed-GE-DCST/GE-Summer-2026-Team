<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greener Edge team session, 7 October 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --teal:#00544F; --teal-deep:#003B37; --lime:#85BE00; --lime-soft:#E4F0C4;
  --paper:#F7FAF8; --ink:#0F2E2A; --mist:#D6E5E1; --muted:#4F6B66; --bad:#B9472F; --bad-soft:#F5DDD6;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body,#app{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Phone view ---------- */
.phone{min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.ph-top{background:var(--teal);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px}
.ph-brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.ph-brand svg{flex:none}
.ph-sub{font-size:14px;opacity:.85;margin-top:2px}
.ph-main{flex:1;padding:22px 20px;max-width:560px;width:100%;margin:0 auto}
.ph-sec{font-size:15px;color:var(--muted);margin:0 0 6px}
.ph-q{font-family:var(--display);font-weight:700;font-size:clamp(24px,6.6vw,30px);line-height:1.18;margin:0 0 10px}
.ph-hint{font-size:16px;line-height:1.45;color:var(--muted);margin:0 0 18px}
.opts{display:grid;gap:12px;margin-top:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:14px 16px;border:2px solid var(--mist);background:#fff;border-radius:14px;font-size:18px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.opt .tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mist);display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--teal);background:#EAF3F1}
.opt[aria-pressed="true"] .tick{background:var(--teal);border-color:var(--teal)}
.opt[aria-pressed="true"] .tick::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.multi .opt .tick{border-radius:7px}
.gb{grid-template-columns:1fr 1fr}
.gb .opt{justify-content:center;font-weight:700;min-height:72px}
.gb .opt.good[aria-pressed="true"]{border-color:#5E8A00;background:var(--lime-soft)}
.gb .opt.bad[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft)}
.gb .opt .tick{display:none}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt{justify-content:center;font-family:var(--display);font-weight:700;font-size:22px;padding:0;min-height:64px}
.scale .opt .tick{display:none}
.ends{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-top:8px}
.saved{margin-top:16px;font-size:16px;color:var(--teal);min-height:24px}
.scenario{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.3;margin:0 0 18px}
textarea{width:100%;min-height:120px;padding:14px;border:2px solid var(--mist);border-radius:14px;font:inherit;font-size:18px;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{border-color:var(--teal);outline:none}
.send{margin-top:12px;min-height:54px;padding:0 26px;border:0;border-radius:999px;background:var(--teal);color:#fff;font-weight:700;font-size:18px;cursor:pointer}
.note-b{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:14px}
.note-b li{font-size:17px;line-height:1.45;padding-left:14px;border-left:4px solid var(--lime)}
.note-b b{display:block;font-family:var(--display);font-size:18px}
.note-body{font-size:18px;line-height:1.5}
.note-foot{margin-top:18px;font-size:16px;line-height:1.45;color:var(--muted)}
a{color:var(--teal);font-weight:700}
.waiting{text-align:center;padding-top:40px}
.waiting .ph-q{font-size:26px}
.rm{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.rm li{background:#fff;border:1px solid var(--mist);border-radius:12px;padding:12px 14px}
.rm .when{font-weight:700;font-size:16px}
.rm .items{font-size:16px;line-height:1.4;color:var(--muted);margin-top:2px}
.ask-fab{position:fixed;left:20px;right:20px;bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:56px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:18px;cursor:pointer;max-width:520px;margin:0 auto;box-shadow:0 6px 20px rgba(0,59,55,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,40,36,.45);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.sheet-in{background:var(--paper);width:100%;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto}
.sheet h2{font-family:var(--display);font-size:24px;margin:0 0 6px}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:16px;line-height:1.45}
.sheet-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ghost{min-height:54px;padding:0 20px;border:2px solid var(--mist);border-radius:999px;background:transparent;font-weight:700;font-size:17px;cursor:pointer;margin-top:12px}

/* ---------- Screen view ---------- */
.screen{height:100%;background:var(--teal);color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative}
.screen .banner{position:absolute;top:0;left:0;right:0;z-index:5}
.sc-top{display:flex;align-items:center;justify-content:space-between;padding:clamp(12px,2.2vh,22px) clamp(20px,3vw,44px) 0;flex:none}
.sc-brand{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.4vw,20px);display:flex;gap:10px;align-items:center;opacity:.95}
.sc-prog{font-size:clamp(14px,1.2vw,18px);opacity:.75}
.sc-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) clamp(170px,21vw,290px);gap:clamp(20px,3vw,48px);padding:clamp(10px,2vh,24px) clamp(20px,3vw,44px);min-height:0}
.sc-stage{min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:safe center}
.sc-sec{font-size:clamp(15px,1.5vw,22px);color:var(--lime);margin:0 0 10px;font-weight:700}
.sc-q{font-family:var(--display);font-weight:800;font-size:clamp(26px,min(3.8vw,6.4vh),58px);line-height:1.08;margin:0 0 14px;letter-spacing:-.01em;max-width:26ch}
.sc-scn{font-family:var(--display);font-weight:600;font-size:clamp(22px,min(2.8vw,5vh),44px);line-height:1.2;margin:0 0 22px;max-width:32ch}
.sc-hint{font-size:clamp(15px,1.5vw,22px);line-height:1.4;opacity:.85;margin:0 0 26px;max-width:60ch}
.bars{display:grid;gap:clamp(8px,1.8vh,16px);max-width:1000px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:clamp(15px,1.5vw,23px);line-height:1.3;margin-bottom:5px;gap:16px}
.bar-top .n{font-family:var(--display);font-weight:800;font-size:clamp(18px,1.8vw,28px);flex:none}
.track{height:clamp(14px,2.4vh,26px);background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;position:relative}
.fill{height:100%;background:var(--lime);border-radius:6px;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.correct .fill{background:#C8F06A}
.bar.correct .bar-top span:first-child::after{content:"  \2713";color:var(--lime)}
.bar.dim .fill{background:rgba(255,255,255,.35)}
.cmp{height:6px;margin-top:4px;background:rgba(255,255,255,.45);border-radius:3px;width:0}
.cmp-key{font-size:18px;opacity:.75;margin-top:8px}
.hidden-v{font-size:clamp(18px,1.8vw,26px);opacity:.8;padding:18px 0}
.answer{margin-top:clamp(12px,2.4vh,26px);background:#fff;color:var(--ink);border-radius:14px;padding:clamp(10px,1.6vh,18px) 22px;font-size:clamp(16px,1.6vw,24px);line-height:1.4;max-width:1000px;border-left:10px solid var(--lime)}
.answer.bad{border-left-color:var(--bad)}
.answer b{font-family:var(--display)}
.sc-note-b{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2.2vh,22px) 40px;max-width:1200px}
.sc-note-b li{border-left:6px solid var(--lime);padding-left:18px;font-size:clamp(15px,1.45vw,23px);line-height:1.4}
.sc-note-b b{display:block;font-family:var(--display);font-size:clamp(18px,1.8vw,28px);margin-bottom:2px}
.sc-body{font-size:clamp(18px,2vw,30px);line-height:1.4;max-width:40ch;opacity:.9}
.sc-foot{margin-top:clamp(12px,2.6vh,28px);font-size:clamp(14px,1.4vw,21px);opacity:.85;max-width:70ch}
.wall{display:flex;flex-wrap:wrap;gap:12px;max-width:1200px;max-height:58vh;overflow:auto}
.wall span{background:#fff;color:var(--ink);border-radius:12px;padding:10px 16px;font-size:22px;line-height:1.3}
.wall span i{font-style:normal;color:var(--teal);font-weight:700;margin-left:8px}
.sc-empty{font-size:24px;opacity:.75}
.road{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;max-width:1500px;margin-top:10px}
.road div{border-top:6px solid var(--lime);padding-top:12px}
.road .w{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.4vw,22px)}
.road .t{display:inline-block;font-size:15px;font-weight:700;padding:2px 10px;border-radius:999px;margin:6px 0;background:rgba(255,255,255,.14)}
.road .i{font-size:clamp(13px,1.2vw,19px);line-height:1.4;opacity:.9}
.road .alpha{border-color:#9FD3C9}.road .build{border-color:#E0B94A}.road .target{border-color:#E0902E}.road .ongoing{border-color:#7FC1B5}.road .explore{border-color:#E39A80}
.sc-side{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center}
.qr{background:#fff;padding:clamp(8px,1vw,16px);border-radius:16px;width:clamp(140px,17vw,248px);aspect-ratio:1;display:grid;place-items:center;color:var(--ink)}
.qr img,.qr canvas{width:100%!important;height:auto!important}
.join{font-size:clamp(12px,1.15vw,18px);line-height:1.35;word-break:break-all;opacity:.9}
.count{font-family:var(--display);font-weight:800;font-size:clamp(36px,4.2vw,64px);line-height:1;color:var(--lime)}
.count-l{font-size:clamp(12px,1.2vw,18px);opacity:.8;margin-top:-6px}
.sc-ctrl{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px clamp(20px,3vw,44px) 10px;opacity:.4;transition:opacity .2s}
.sc-ctrl:hover,.sc-ctrl:focus-within{opacity:1}
.sc-ctrl button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;line-height:1.4;cursor:pointer}
.sc-ctrl button.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.sc-ctrl .sp{flex:1}
.banner{background:#F3D9A6;color:#3d2c00;padding:10px 20px;font-size:15px;display:none}
.overlay{position:fixed;inset:0;background:var(--teal-deep);color:#fff;display:none;padding:44px;overflow:auto;z-index:30}
.overlay.open{display:block}
.overlay h2{font-family:var(--display);font-size:44px;margin:0 0 24px}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.olist div{background:#fff;color:var(--ink);border-radius:14px;padding:16px 20px;font-size:22px;line-height:1.4}
@media (max-width:1000px){.sc-note-b{grid-template-columns:1fr}.road{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.sc-main{grid-template-columns:1fr}.sc-side{display:none}}

.sc-intro{max-width:1100px}
.sc-intro .sc-q{font-size:clamp(34px,min(6vw,10vh),92px);max-width:18ch;margin-bottom:22px}
.sc-intro .sc-body{max-width:44ch}
.tag-b{display:inline-block;margin-left:10px;font-size:.8em;background:#E0B94A;color:var(--ink);padding:1px 10px;border-radius:999px;font-weight:700}
.cloud{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;max-width:1200px;margin-top:clamp(10px,2vh,22px)}
.cloud span{font-family:var(--display);font-weight:700;line-height:1.05;transition:font-size .4s}
.cloud-h{font-size:clamp(14px,1.3vw,19px);opacity:.75;margin-top:clamp(14px,2.6vh,26px)}
.life{margin-top:clamp(10px,2vh,24px);max-width:1300px}
.life-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.life-st{background:rgba(255,255,255,.1);border-top:6px solid var(--lime);border-radius:4px;padding:clamp(8px,1.4vh,14px) 10px;font-size:clamp(13px,1.25vw,20px);line-height:1.25;font-weight:700;min-height:clamp(56px,10vh,96px)}
.life-st.post{border-top-color:#9FD3C9}
.life-br{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.life-br div{border:2px solid rgba(255,255,255,.55);border-top:0;height:14px;border-radius:0 0 6px 6px}
.life-lab{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;font-size:clamp(13px,1.2vw,19px);margin-top:4px;opacity:.9}
.life-cmp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,30px);margin-top:clamp(16px,3.4vh,36px)}
.life-cmp div{background:#fff;color:var(--ink);border-radius:14px;padding:clamp(10px,1.6vh,18px) 20px;font-size:clamp(14px,1.35vw,21px);line-height:1.4}
.life-cmp b{display:block;font-family:var(--display);font-size:clamp(17px,1.6vw,25px)}
.ph-life{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.ph-life li{background:#fff;border:1px solid var(--mist);border-left:6px solid var(--lime);border-radius:10px;padding:10px 14px;font-size:17px;font-weight:700}
.ph-life li.post{border-left-color:#9FD3C9}
.ph-life .gate{font-size:15px;color:var(--muted);font-weight:400;padding:2px 4px;border:0;background:none}
.ph-cmp{margin-top:18px;display:grid;gap:10px}
.ph-cmp div{background:#EAF3F1;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.45}
.ph-cmp b{display:block;font-family:var(--display);font-size:17px}
.other-row{display:flex;gap:8px;margin-top:14px}
.other-row input{flex:1;min-width:0;min-height:54px;padding:0 14px;border:2px solid var(--mist);border-radius:14px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
.other-row input:focus{border-color:var(--teal);outline:none}
.other-row .send{margin-top:0;padding:0 18px}
.ph-intro{padding-top:12px}
.ph-intro .ph-q{font-size:clamp(28px,8vw,36px)}

.sc-note-b.three{grid-template-columns:1fr 1fr 1fr}
.overlay .ov-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
.overlay h2{margin:0}
.ov-close{background:var(--lime);color:var(--ink);border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px;cursor:pointer}
.count.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.cloudbox{position:relative;width:100%;height:clamp(240px,46vh,520px);margin-top:clamp(8px,1.6vh,18px)}
.cloudbox.small{height:clamp(110px,20vh,220px)}
.cloudbox span{position:absolute;white-space:nowrap;font-family:var(--display);font-weight:800;line-height:1.05;transition:left .5s,top .5s,font-size .5s}
.cloudbox span.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.donut{display:flex;align-items:center;gap:clamp(18px,3vw,48px);flex-wrap:wrap}
.donut svg{width:clamp(150px,min(22vw,36vh),300px);height:auto;flex:none}
.dseg{transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.dtot{font-family:var(--display);font-weight:800;font-size:26px;fill:#fff}
.dlab{font-size:10px;fill:rgba(255,255,255,.75)}
.dleg{list-style:none;margin:0;padding:0;display:grid;gap:clamp(6px,1.4vh,14px)}
.dleg li{display:flex;align-items:center;gap:12px;font-size:clamp(15px,1.5vw,23px)}
.dleg .dot{width:18px;height:18px;border-radius:50%;flex:none}
.dleg .dv{font-family:var(--display);font-weight:800;margin-left:auto;padding-left:20px}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(10px,2vw,28px);height:clamp(160px,34vh,340px);max-width:900px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.cbar{width:100%;flex:1;display:flex;align-items:flex-end;background:rgba(255,255,255,.08);border-radius:8px 8px 0 0}
.cfill{width:100%;height:0;background:var(--lime);border-radius:8px 8px 0 0;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.cv{font-family:var(--display);font-weight:800;font-size:clamp(18px,1.8vw,28px);min-height:1.3em}
.cl{font-family:var(--display);font-weight:800;font-size:clamp(18px,1.8vw,28px);margin-top:8px}
.cends{display:flex;justify-content:space-between;max-width:900px;font-size:clamp(14px,1.4vw,21px);opacity:.85;margin-top:8px}
.anat{font-size:clamp(19px,min(2.1vw,3.6vh),32px);line-height:2.75;max-width:58ch;margin:clamp(10px,2vh,24px) 0 0}
.seg{position:relative;background:color-mix(in srgb,var(--c) 26%,transparent);border-bottom:4px solid var(--c);padding:2px 4px;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg em{position:absolute;left:0;top:-1.05em;font-style:normal;font-size:.5em;font-weight:700;color:var(--c);white-space:nowrap;line-height:1}
.ph-anat{font-size:18px;line-height:2.9;overflow:hidden;padding-right:4px}
.phone{overflow-x:hidden}
.ph-anat .seg{background:color-mix(in srgb,var(--c) 30%,#fff);border-bottom-color:color-mix(in srgb,var(--c) 70%,#000)}
.ph-anat .seg em{color:color-mix(in srgb,var(--c) 55%,#000);font-size:.62em}
.dir{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.6vw,24px);margin-top:clamp(10px,2vh,24px);position:relative;max-width:1500px}
.dir::before{content:"";position:absolute;left:0;right:0;top:9px;height:3px;background:rgba(255,255,255,.3)}
.dir-col{position:relative}
.dir-dot{width:21px;height:21px;border-radius:50%;background:var(--lime);border:4px solid var(--teal);box-shadow:0 0 0 3px var(--lime);position:relative;z-index:1}
.dir-col.now .dir-dot{background:#E0B94A;box-shadow:0 0 0 3px #E0B94A}
.dir-col.next .dir-dot{background:#9FD3C9;box-shadow:0 0 0 3px #9FD3C9}
.dir-col.explore .dir-dot{background:#F28C6B;box-shadow:0 0 0 3px #F28C6B}
.dir-h{font-family:var(--display);font-weight:800;font-size:clamp(17px,1.7vw,26px);margin:12px 0 10px}
.dir-card{background:rgba(255,255,255,.1);border-left:5px solid var(--lime);border-radius:8px;padding:clamp(8px,1.2vh,12px) 12px;font-size:clamp(13px,1.2vw,19px);line-height:1.35;margin-bottom:8px}

let db = {}, live = false, fdb = null, ready = false;
const LKEY = 'ge-oct-local';
function localLoad(){ try { db = JSON.parse(localStorage.getItem(LKEY) || '{}'); } catch(e){ db = {}; } }
function localSave(){ try { localStorage.setItem(LKEY, JSON.stringify(db)); } catch(e){} }
async function put(k, v){ db[k] = v; if(live){ try { await fdb.ref(ROOT + '/' + k).set(v); } catch(e){ showBanner('A vote didn\u2019t save. Check the connection and try again.'); } } else localSave(); render(); }
async function del(k){ delete db[k]; if(live){ try { await fdb.ref(ROOT + '/' + k).remove(); } catch(e){} } else localSave(); render(); }
async function wipe(){ db = {}; if(live){ await fdb.ref(ROOT).remove(); } else localSave(); render(); }
function start(){
  if(typeof firebase !== 'undefined'){
    try {
      firebase.initializeApp(firebaseConfig); fdb = firebase.database(); live = true;
      fdb.ref(ROOT).on('value', s => { db = s.val() || {}; ready = true; render(); },
        () => { live = false; localLoad(); ready = true; showBanner('Can\u2019t reach the live database. Check the Firebase rules. Running in test mode.'); render(); });
      return;
    } catch(e){ live = false; }
  }
  localLoad(); ready = true;
  window.addEventListener('storage', e => { if(e.key === LKEY){ localLoad(); render(); } });
  showBanner('Test mode: votes only sync between tabs on this device.');
  render();
}

function boundsHTML(q, phone){
  const n = q.stages.length;
  let h = '<div class="bnd-wrap' + (phone ? ' ph' : '') + '" style="--n:' + n + '"><div class="bnd-stages">' + q.stages.map(s => '<div class="bnd-st">' + esc(s) + '</div>').join('') + '</div>';
  q.bounds.forEach((b, i) => { const st = b.start || 1, span = b.end - st + 1, out = span <= 1 && b.end < n;
    h += '<div class="bnd-row"><div class="bnd-bar" style="grid-column:' + st + ' / ' + (b.end + 1) + ';--bc:' + BND[i % BND.length] + '">' + (out ? '' : '<span>' + esc(b.label) + '</span>') + '</div>' + (out ? '<div class="bnd-out" style="grid-column:' + (b.end + 1) + ' / -1">' + esc(b.label) + '</div>' : '') + '</div>'; });
  return h + '</div>';
}
const BND = ['#85BE00','#9FD3C9','#E0B94A','#F28C6B','#B8A4F0','#6FD3F0'];
function modelSVG(q){
  const N = {}; q.nodes.forEach(n => N[n.id] = n);
  const W = q.w || 1200, H = q.h || 680, bw = n => n.wd || 170, bh = n => n.ht || 54;
  const kindC = {ing:'#85BE00', pack:'#E0B94A', energy:'#6FD3F0', site:'#FFFFFF', move:'#9FD3C9', down:'#F28C6B'};
  let s = '<svg class="model" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(q.title) + '">';
  s += '<defs><marker id="mArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(255,255,255,.75)"/></marker></defs>';
  if(q.gateX) s += '<line x1="' + q.gateX + '" y1="20" x2="' + q.gateX + '" y2="' + (H - 10) + '" stroke="rgba(255,255,255,.45)" stroke-width="2" stroke-dasharray="8 7"/><text x="' + (q.gateX + 8) + '" y="34" class="m-gate">Factory gate</text>';
  q.edges.forEach(e => { const a = N[e[0]], b = N[e[1]];
    if(e[3] === 'v'){ const y1 = a.y + bh(a) / 2, y2 = b.y - bh(b) / 2 - 4; s += '<path class="m-edge" d="M' + a.x + ' ' + y1 + ' L' + b.x + ' ' + y2 + '" marker-end="url(#mArr)"/>'; if(e[2]) s += '<text class="m-elab" x="' + (a.x + 8) + '" y="' + ((y1 + y2) / 2 + 4) + '">' + esc(e[2]) + '</text>'; return; }
    const x1 = a.x + bw(a) / 2, y1 = a.y, x2 = b.x - bw(b) / 2 - 4, y2 = b.y; const mx = (x1 + x2) / 2;
    s += '<path class="m-edge" d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2 + '" marker-end="url(#mArr)"/>';
    if(e[2]) s += '<text class="m-elab" x="' + mx + '" y="' + ((y1 + y2) / 2 - 6) + '" text-anchor="middle">' + esc(e[2]) + '</text>'; });
  q.nodes.forEach(n => { const w = bw(n), hh = bh(n), c = kindC[n.k] || '#fff';
    s += '<g class="m-node"><rect x="' + (n.x - w / 2) + '" y="' + (n.y - hh / 2) + '" width="' + w + '" height="' + hh + '" rx="8" fill="' + (n.k === 'site' ? '#fff' : 'rgba(255,255,255,.1)') + '" stroke="' + c + '" stroke-width="' + (n.k === 'site' ? 0 : 2) + '"/>';
    const lines = n.t.split('\n'); lines.forEach((ln, i) => { s += '<text x="' + n.x + '" y="' + (n.y + (i - (lines.length - 1) / 2) * 17 + 5) + '" text-anchor="middle" class="m-t' + (n.k === 'site' ? ' dark' : '') + (i ? ' sub' : '') + '">' + esc(ln) + '</text>'; }); s += '</g>'; });
  if(q.legend){ let lx = 20; q.legend.forEach(l => { s += '<rect x="' + lx + '" y="' + (H - 26) + '" width="14" height="14" rx="3" fill="none" stroke="' + kindC[l[0]] + '" stroke-width="2.5"/><text x="' + (lx + 20) + '" y="' + (H - 14) + '" class="m-leg">' + esc(l[1]) + '</text>'; lx += 30 + l[1].length * 8.2; }); }

function guesses(q){ return keysFor('g:' + q.id + ':').map(k => Number(db[k])).filter(v => isFinite(v)); }
function mine(q){ const s = new Set(); keysFor('v:' + q.id + ':').forEach(k => { if(k.endsWith(':' + uid)) s.add(parseInt(k.split(':')[2], 10)); }); return s; }
function voters(q){ const s = new Set(); keysFor('v:' + q.id + ':').forEach(k => s.add(k.split(':')[3])); return s.size; }
function words(qid){ return keysFor('o:' + qid + ':').map(k => db[k]).filter(v => typeof v === 'string'); }
function texts(qid){ return keysFor('s:' + qid + ':').map(k => ({k, v: db[k]})).filter(o => typeof o.v === 'string'); }
const flag = k => !!db[k];

async function vote(q, i){
  const mineSet = mine(q), key = 'v:' + q.id + ':' + i + ':' + uid;
  if(q.type === 'multi'){ if(mineSet.has(i)) await del(key); else await put(key, 1); return; }
  for(const j of mineSet){ if(j !== i) await del('v:' + q.id + ':' + j + ':' + uid); }
  if(!mineSet.has(i)) await put(key, 1);
}
async function sendWord(qid, t){ t = (t || '').trim().slice(0, 40); if(!t) return false; await put('o:' + qid + ':' + uid + ':' + rnd(), t); return true; }
async function sendText(qid, t){ t = (t || '').trim().slice(0, 300); if(!t) return false; await put('s:' + qid + ':' + uid + ':' + rnd(), t); return true; }

  box.innerHTML = '';

    [['WPPN checker',300],['Walkthrough notes',370],['Report populator',440]].forEach(c => s += vBox(36, c[1], 230, 56, c[0], ''));
    const tg = [['Any chat',70],['Project: Client X',230],['Project: Bids',390]];
    tg.forEach(t => { s += vArrow(288, 96, 450, t[1] + 34, true); s += vArrow(288, 362, 450, t[1] + 34, true); s += vBox(454, t[1], 196, 68, t[0], '', {solid:true}); });
    s += vLab(560, 520, 'used whenever a task matches');
  }
  return s + '</svg>';
}
/* ----- direction graph: branches moving through time ----- */
const DIRC = {built:'#85BE00', prog:'#E0B94A', soon:'#9FD3C9', exp:'#F28C6B'};
let dirSeen = null;
function dirGraph(q, ideas){
  const W = 1600, cols = {built:530, prog:910, soon:1290}, bw = 350, bh = 50, laneY = i => 120 + i * 112;
  const nL = q.tracks.length, exY = laneY(nL) + 10, H = exY + 70 + (ideas.length > 4 ? 60 : 0);
  let s = '<svg class="dsvg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(q.title) + '">' + VDEF;
  [['Earlier in 2026', cols.built], ['Now', cols.prog], ['Coming soon', cols.soon]].forEach(c => s += '<text x="' + c[1] + '" y="46" text-anchor="middle" class="d-h">' + esc(c[0]) + '</text>');
  s += '<line class="d-now" x1="' + cols.prog + '" y1="64" x2="' + cols.prog + '" y2="' + (exY - 40) + '"/>';
  const ty = (laneY(0) + exY) / 2;
  s += '<circle cx="26" cy="' + ty + '" r="13" fill="#85BE00"/>';
  const lanes = q.tracks.map((tr, li) => ({name: tr.name, items: tr.items, y: laneY(li)})).concat([{name: 'Exploring', y: exY, ideas: true}]);
  lanes.forEach(L => { s += '<path class="d-trunk" fill="none" d="M39 ' + ty + ' C 60 ' + ty + ' 40 ' + L.y + ' 66 ' + L.y + '"/><text x="74" y="' + (L.y + 7) + '" class="d-lane">' + esc(L.name) + '</text>'; });
  let nodes = '';
  q.tracks.forEach((tr, li) => {
    const y = laneY(li), groups = [];
    ['built','prog','soon'].forEach(st => { const g = tr.items.filter(it => it[1] === st); if(g.length) groups.push(g.map((it, k) => ({it, x: cols[st], y: y + (g.length > 1 ? (k - (g.length - 1) / 2) * 56 : 0)}))); });
    let from = [{x: 312, y, label: true}];
    groups.forEach(g => { from.forEach(f => g.forEach(p => { const x1 = f.label ? f.x : f.x + bw / 2, x2 = p.x - bw / 2 - 4, mx = (x1 + x2) / 2;
        s += '<path class="m-edge" d="M' + x1 + ' ' + f.y + ' C ' + mx + ' ' + f.y + ' ' + mx + ' ' + p.y + ' ' + x2 + ' ' + p.y + '" marker-end="url(#vArr)"/>'; }));
      g.forEach(p => { const c = DIRC[p.it[1]];
        nodes += '<g class="d-node' + (p.it[1] === 'prog' ? ' live' : '') + '"><rect x="' + (p.x - bw / 2) + '" y="' + (p.y - bh / 2) + '" width="' + bw + '" height="' + bh + '" rx="10" fill="#0B655F" stroke="' + c + '" stroke-width="3"/>'
          + '<text x="' + p.x + '" y="' + (p.y + (p.it[2] ? -3 : 6)) + '" text-anchor="middle" class="d-t">' + esc(p.it[0]) + '</text>' + (p.it[2] ? '<text x="' + p.x + '" y="' + (p.y + 17) + '" text-anchor="middle" class="d-s">' + esc(p.it[2]) + '</text>' : '') + '</g>'; });
      from = [g[0]]; });
  });
  s += nodes;
  const seen = dirSeen || (dirSeen = new Set());
  if(!ideas.length) s += '<text x="330" y="' + (exY + 7) + '" class="d-s">Send an idea from your phone and it appears here</text>';
  let idg = '';
  ideas.slice(0, 10).forEach((o, i) => { const row = Math.floor(i / 5), x = 470 + (i % 5) * 240, y = exY + row * 60, isNew = !seen.has(o.k); seen.add(o.k);
    s += '<path class="m-edge" d="M312 ' + exY + ' C 350 ' + exY + ' 330 ' + y + ' ' + (x - 118) + ' ' + y + '"/>';
    idg += '<g class="d-idea' + (isNew ? ' pop' : '') + '" style="transform-origin:' + x + 'px ' + y + 'px"><rect x="' + (x - 112) + '" y="' + (y - 22) + '" width="224" height="44" rx="22" fill="#5E4A3F" stroke="#F28C6B" stroke-width="2.5"/><text x="' + x + '" y="' + (y + 6) + '" text-anchor="middle" class="d-t">' + esc(o.t.length > 24 ? o.t.slice(0, 23) + '\u2026' : o.t) + (o.n > 1 ? ' \u00d7' + o.n : '') + '</text></g>'; });
  return s + idg + '</svg>';
}
/* ----- little bits of fun ----- */
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n, chars){
  const layer = document.getElementById('rlayer'); if(!layer || calm()) return;
  const cols = ['#85BE00','#E0B94A','#F28C6B','#9FD3C9','#B8A4F0','#FFFFFF'];
  for(let i = 0; i < (n || 90); i++){
    const s = document.createElement('span'); s.className = 'conf';
    if(chars){ s.textContent = chars[i % chars.length]; s.style.fontSize = (26 + Math.random() * 26) + 'px'; s.classList.add('char'); }
    else { s.style.background = cols[i % cols.length]; s.style.width = (6 + Math.random() * 8) + 'px'; s.style.height = (10 + Math.random() * 10) + 'px'; }
    s.style.left = (Math.random() * 100) + '%'; s.style.animationDuration = (2.2 + Math.random() * 2.2) + 's'; s.style.animationDelay = (Math.random() * .6) + 's';
    s.style.setProperty('--sx', (Math.random() * 200 - 100) + 'px'); s.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    layer.appendChild(s); setTimeout(() => s.remove(), 5200);
  }
}
function funToast(msg){
  const layer = document.getElementById('rlayer'); if(!layer) return;
  const s = document.createElement('div'); s.className = 'fun-toast'; s.textContent = msg; layer.appendChild(s); setTimeout(() => s.remove(), 2600);
}
let funState = {ra: {}, mile: {}, end: false, cabbage: new Set(), combo: []};
function funChecks(q){
  // confetti when an answer is revealed
  const raOn = flag('ra:' + q.id);
  if(raOn && funState.ra[q.id] === false) confetti(70);
  funState.ra[q.id] = raOn;
  // milestones
  if(isVote(q)){ const v = voters(q), m = Math.floor(v / 10) * 10, prev = funState.mile[q.id];
    if(prev !== undefined && m > prev && m > 0) funToast('\u{1F389} ' + m + ' votes!');
    funState.mile[q.id] = m; }
  // thank you slide
  if(q.id === 'end' && !funState.end){ funState.end = true; confetti(140); }
  if(q.id !== 'end') funState.end = false;
  // the June cabbage, back by popular demand
  const all = keysFor('s:').concat(keysFor('o:'));
  all.forEach(k => { const v = db[k]; if(typeof v === 'string' && /cabbage/i.test(v) && !funState.cabbage.has(k)){ const first = funState.cabbageReady; funState.cabbage.add(k); if(first) { confetti(40, ['\u{1F96C}']); funToast('\u{1F96C} The cabbage is back'); } } });
  funState.cabbageReady = true;
}
/* emoji reactions float up the screen */
let reactSeen = null;
function floatReactions(){
  const ks = keysFor('r:');
  if(reactSeen === null){ reactSeen = new Set(ks); return; }
  const layer = document.getElementById('rlayer'); if(!layer) return;
  ks.forEach(k => { if(reactSeen.has(k)) return; reactSeen.add(k);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const now = Date.now(); funState.combo = funState.combo.filter(c => now - c.t < 4000); funState.combo.push({e: db[k], t: now});
    const same = funState.combo.filter(c => c.e === db[k]).length;
    if(same === 6){ funToast(db[k] + ' \u00d76 combo!'); }
    if(same === 12){ funToast(db[k] + ' \u00d712 MEGA combo!'); confetti(30, [db[k]]); funState.combo = []; }
    const s = document.createElement('span'); s.className = 'rfloat'; s.textContent = db[k]; s.style.left = (8 + Math.random() * 84) + '%'; s.style.animationDuration = (2.6 + Math.random() * 1.4) + 's'; s.style.fontSize = (34 + Math.random() * 30) + 'px';
    layer.appendChild(s); setTimeout(() => s.remove(), 4300); });
}
function wallHTML(items){
  if(!items.length) return '<p class="sc-empty">No answers yet. They\u2019ll appear here as people send them.</p>';
  const arr = tallyWords(items.map(o => o.v));
  return '<div class="wall">' + arr.map(o => '<span>' + esc(o.t) + (o.n > 1 ? '<i>\u00d7' + o.n + '</i>' : '') + '</span>').join('') + '</div>';
}

function exportResults(){
  const L = ['Greener Edge, ' + SESSION, 'Session results, exported ' + new Date().toLocaleString('en-GB'), ''];
  let sec = '';
  STEPS.forEach(q => {
    if(q.sec !== sec){ sec = q.sec; L.push('== ' + sec + ' ==', ''); }
    if(q.type === 'tracks' && q.ask){ L.push(q.ask.label); const tx = texts(q.ask.id); if(!tx.length) L.push('  (none)'); tx.forEach(o => L.push('  - ' + o.v)); L.push(''); return; }
    if(['note','roadmap','intro','lifecycle','anatomy','book','bounds','model','tracks','interest'].includes(q.type)) return;
    if(q.type === 'guess'){ L.push(q.q); const g = guesses(q); L.push('  (' + g.length + ' guesses, answer ' + q.answer + ')'); g.sort((a,b) => a-b).forEach(v => L.push('   - ' + v)); L.push(''); return; }
    L.push(q.q);
    if(q.type === 'open'){ const t = texts(q.id); if(!t.length) L.push('  (no answers)'); t.forEach(o => L.push('  - ' + o.v)); }
    else { const c = counts(q), tot = c.reduce((a,b) => a+b, 0); L.push('  (' + voters(q) + ' people, ' + tot + ' votes)'); labels(q).forEach((l,i) => L.push('  - ' + l + ': ' + c[i] + ' (' + (tot ? Math.round(c[i]/tot*100) : 0) + '%)')); if(q.other){ const w = words(q.id); if(w.length){ L.push('  Also said:'); w.forEach(x => L.push('   - ' + x)); } } }
    L.push('');
  });
  L.push('== Yes to a session with Zed or George ==', ''); const yes = keysFor('b:').map(k => { try { return JSON.parse(db[k]).n || '(no name given)'; } catch(e){ return '?'; } }); if(!yes.length) L.push('  (none)'); yes.forEach(n => L.push('  - ' + n)); L.push('');
  L.push('== Session requests ==', ''); const bk = texts('book'); if(!bk.length) L.push('  (none)'); bk.forEach(o => L.push('  - ' + o.v)); L.push('');
  L.push('== Questions from the room ==', ''); const a = texts(ASK_ID); if(!a.length) L.push('  (none)'); a.forEach(o => L.push('  - ' + o.v));
  const blob = new Blob([L.join('\n')], {type: 'text/plain'}); const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href = url; link.download = 'ge_oct2026_results.txt'; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function render(){ isScreen ? renderScreen() : renderPhone(); }
render(); start();
})();
