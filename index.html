body{font-family:var(--body);color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}

.opt[aria-pressed="true"] .tick{background:var(--teal);border-color:var(--teal)}
.opt[aria-pressed="true"] .tick::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.multi .opt .tick{border-radius:7px}
.gb{grid-template-columns:1fr 1fr}
.gb .opt{justify-content:center;font-weight:700;min-height:72px}
.gb .opt.good[aria-pressed="true"]{border-color:#5E8A00;background:var(--lime-soft)}
.gb .opt.bad[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft)}
.gb .opt .tick{display:none}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt{justify-content:center;font-family:var(--display);font-weight:700;font-size:22px;padding:0;min-height:64px}
.scale .opt .tick{display:none}
.ends{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-top:8px}
.saved{margin-top:16px;font-size:16px;color:var(--teal);min-height:24px}
.scenario{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.3;margin:0 0 18px}
textarea{width:100%;min-height:120px;padding:14px;border:2px solid var(--mist);border-radius:14px;font:inherit;font-size:18px;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{border-color:var(--teal);outline:none}
.send{margin-top:12px;min-height:54px;padding:0 26px;border:0;border-radius:999px;background:var(--teal);color:#fff;font-weight:700;font-size:18px;cursor:pointer}
.note-b{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:14px}
.note-b li{font-size:17px;line-height:1.45;padding-left:14px;border-left:4px solid var(--lime)}
.note-b b{display:block;font-family:var(--display);font-size:18px}
.note-body{font-size:18px;line-height:1.5}
.note-foot{margin-top:18px;font-size:16px;line-height:1.45;color:var(--muted)}
a{color:var(--teal);font-weight:700}
.waiting{text-align:center;padding-top:40px}
.waiting .ph-q{font-size:26px}
.rm{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.rm li{background:#fff;border:1px solid var(--mist);border-radius:12px;padding:12px 14px}
.rm .when{font-weight:700;font-size:16px}
.rm .items{font-size:16px;line-height:1.4;color:var(--muted);margin-top:2px}

.sc-foot{margin-top:28px;font-size:22px;opacity:.85}

.sc-empty{font-size:24px;opacity:.75}

.qr{background:#fff;padding:16px;border-radius:16px;width:248px;height:248px;display:grid;place-items:center}
.qr img,.qr canvas{width:216px!important;height:216px!important}
.join{font-size:19px;line-height:1.35;word-break:break-all;opacity:.9}
.count{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--lime)}
.count-l{font-size:18px;opacity:.8;margin-top:-6px}
.sc-ctrl{display:flex;gap:8px;flex-wrap:wrap;padding:12px 44px 18px;opacity:.25;transition:opacity .2s}

.banner{background:#F3D9A6;color:#3d2c00;padding:10px 20px;font-size:15px;display:none}
.overlay{position:fixed;inset:0;background:var(--teal-deep);color:#fff;display:none;padding:44px;overflow:auto;z-index:30}
.overlay.open{display:block}
.overlay h2{font-family:var(--display);font-size:44px;margin:0 0 24px}

@media (max-width:1100px){.sc-main{grid-template-columns:1fr}.sc-side{display:none}.sc-note-b{grid-template-columns:1fr}.road{grid-template-columns:repeat(3,1fr)}}

const keysFor = p => Object.keys(db).filter(k => k.indexOf(p) === 0);
const nOpts = q => q.type === 'scale' ? 5 : q.type === 'example' ? 2 : (q.opts || []).length;
const labels = q => q.type === 'scale' ? ['1','2','3','4','5'] : q.type === 'example' ? ['Good use','Bad use'] : q.opts;
function counts(q){ const n = nOpts(q), c = new Array(n).fill(0); keysFor('v:' + q.id + ':').forEach(k => { const i = parseInt(k.split(':')[2], 10); if(i >= 0 && i < n) c[i]++; }); return c; }
function mine(q){ const s = new Set(); keysFor('v:' + q.id + ':').forEach(k => { if(k.endsWith(':' + uid)) s.add(parseInt(k.split(':')[2], 10)); }); return s; }
function voters(q){ const s = new Set(); keysFor('v:' + q.id + ':').forEach(k => s.add(k.split(':')[3])); return s.size; }
function texts(qid){ return keysFor('s:' + qid + ':').map(k => ({k, v: db[k]})).filter(o => typeof o.v === 'string'); }
const flag = k => !!db[k];

async function vote(q, i){
  const mineSet = mine(q), key = 'v:' + q.id + ':' + i + ':' + uid;
  if(q.type === 'multi'){ if(mineSet.has(i)) await del(key); else await put(key, 1); return; }
  for(const j of mineSet){ if(j !== i) await del('v:' + q.id + ':' + j + ':' + uid); }
  if(!mineSet.has(i)) await put(key, 1);
}
async function sendText(qid, t){ t = (t || '').trim().slice(0, 300); if(!t) return false; await put('s:' + qid + ':' + uid + ':' + rnd(), t); return true; }

/* ===================== PHONE ===================== */
let phoneStep = -1;
function phoneShell(){
  app.innerHTML = '<div class="phone"><header class="ph-top"><div class="ph-brand">' + LEAF + 'Greener Edge</div><div class="ph-sub">' + esc(SESSION) + '</div></header>'
    + '<div class="banner" id="banner"></div><main class="ph-main" id="ph" aria-live="polite"></main>'
    + '<button class="ask-fab" id="askBtn" type="button">Ask a question</button>'
    + '<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="askT"><div class="sheet-in"><h2 id="askT">Ask a question</h2><p>Anonymous. Ask anything, or share a thought. We\u2019ll answer some at the end and follow up on the rest.</p>'
    + '<label for="askTa" class="ph-sec">Your question or thought</label><textarea id="askTa" maxlength="300"></textarea>'
    + '<div class="sheet-row"><button class="send" id="askSend" type="button">Send question</button><button class="ghost" id="askClose" type="button">Close</button></div><div class="saved" id="askMsg"></div></div></div></div>';
  const sheet = document.getElementById('sheet');
  document.getElementById('askBtn').onclick = () => { sheet.classList.add('open'); document.getElementById('askMsg').textContent=''; setTimeout(() => document.getElementById('askTa').focus(), 50); };
  document.getElementById('askClose').onclick = () => sheet.classList.remove('open');
  sheet.addEventListener('click', e => { if(e.target === sheet) sheet.classList.remove('open'); });
  document.getElementById('askSend').onclick = async () => { const ta = document.getElementById('askTa'); if(await sendText(ASK_ID, ta.value)){ ta.value=''; document.getElementById('askMsg').textContent = 'Question sent. Thank you.'; } };
}
function renderPhone(){
  if(!document.getElementById('ph')) phoneShell();
  const box = document.getElementById('ph');
  if(!ready){ box.innerHTML = '<div class="waiting"><p class="ph-q">Connecting\u2026</p></div>'; return; }
  const i = curIndex(), q = STEPS[i];
  if(i !== phoneStep){ phoneStep = i; box.innerHTML = phoneStepHTML(q); bindPhone(q); window.scrollTo(0,0); }
  updatePhone(q);
}
function phoneStepHTML(q){
  let h = '<p class="ph-sec">' + esc(q.sec) + '</p>';
  if(q.type === 'note'){
    h += '<h1 class="ph-q">' + esc(q.title) + '</h1>';
    if(q.body) h += '<p class="note-body">' + esc(q.body) + '</p>';
    if(q.bullets) h += '<ul class="note-b">' + q.bullets.map(b => '<li><b>' + esc(b[0]) + '</b>' + esc(b[1]) + '</li>').join('') + '</ul>';
    if(q.foot) h += '<p class="note-foot">' + esc(q.foot) + '</p>';
    if(q.link) h += '<p class="note-foot"><a href="' + esc(q.link.url) + '" target="_blank" rel="noopener">' + esc(q.link.text) + '</a></p>';
    return h;
  }
  if(q.type === 'roadmap'){
    return h + '<h1 class="ph-q">' + esc(q.title) + '</h1><ul class="rm">' + q.cols.map(c => '<li><div class="when">' + esc(c.when) + '</div><div class="items">' + c.items.map(esc).join('<br>') + '</div></li>').join('') + '</ul>';
  }
  if(q.type === 'open'){
    return h + '<h1 class="ph-q">' + esc(q.q) + '</h1>' + (q.hint ? '<p class="ph-hint">' + esc(q.hint) + '</p>' : '')
      + '<label for="ota" class="ph-sec">Your answer</label><textarea id="ota" maxlength="300"></textarea><button class="send" id="osend" type="button">Send answer</button><div class="saved" id="omsg"></div>';
  }
  if(q.type === 'example'){
    h += '<p class="ph-hint">Good use or bad use?</p><h1 class="scenario">' + esc(q.q) + '</h1>';
    return h + '<div class="opts gb" role="group" aria-label="Your answer"><button type="button" class="opt good" data-i="0" aria-pressed="false"><span class="tick"></span>Good use</button><button type="button" class="opt bad" data-i="1" aria-pressed="false"><span class="tick"></span>Bad use</button></div><div class="saved" id="smsg"></div>';
  }
  h += '<h1 class="ph-q">' + esc(q.q) + '</h1>' + (q.hint ? '<p class="ph-hint">' + esc(q.hint) + '</p>' : (q.type === 'multi' ? '<p class="ph-hint">Pick all that apply</p>' : ''));
  if(q.type === 'scale'){
    h += '<div class="opts scale" role="group" aria-label="Pick 1 to 5">' + [0,1,2,3,4].map(i => '<button type="button" class="opt" data-i="' + i + '" aria-pressed="false"><span class="tick"></span>' + (i+1) + '</button>').join('') + '</div><div class="ends"><span>1 \u00b7 ' + esc(q.ends[0]) + '</span><span>5 \u00b7 ' + esc(q.ends[1]) + '</span></div>';
  } else {
    h += '<div class="opts' + (q.type === 'multi' ? ' multi' : '') + '" role="group" aria-label="Your answer">' + q.opts.map((o,i) => '<button type="button" class="opt" data-i="' + i + '" aria-pressed="false"><span class="tick"></span>' + esc(o) + '</button>').join('') + '</div>';
  }
  return h + '<div class="saved" id="smsg"></div>';
}
function bindPhone(q){
  document.querySelectorAll('#ph .opt').forEach(b => b.onclick = () => vote(q, parseInt(b.dataset.i, 10)));
  const s = document.getElementById('osend');
  if(s) s.onclick = async () => { const ta = document.getElementById('ota'); if(await sendText(q.id, ta.value)){ ta.value=''; document.getElementById('omsg').textContent = 'Sent. Add another if you like.'; } };
}
function updatePhone(q){
  if(!['single','multi','scale','example'].includes(q.type)) return;
  const m = mine(q);
  document.querySelectorAll('#ph .opt').forEach(b => b.setAttribute('aria-pressed', m.has(parseInt(b.dataset.i, 10)) ? 'true' : 'false'));
  const msg = document.getElementById('smsg');
  if(msg) msg.textContent = m.size ? (q.type === 'multi' ? 'Saved. Tap again to remove a choice.' : 'Vote saved. Tap another to change it.') : '';
}

/* ===================== SCREEN ===================== */
let showAsk = false, qrDone = false;
function screenShell(){
  app.innerHTML = '<div class="screen"><div class="banner" id="banner" style="grid-column:1/-1"></div><header class="sc-top"><div class="sc-brand">' + LEAF + 'Greener Edge \u00b7 ' + esc(SESSION) + '</div><div class="sc-prog" id="prog"></div></header>'
    + '<main class="sc-main"><section class="sc-stage" id="stage" aria-live="polite"></section><aside class="sc-side"><div class="qr" id="qr"></div><div class="join">Scan to join<br>' + esc(location.origin + location.pathname) + '</div><div><div class="count" id="cnt"></div><div class="count-l" id="cntl"></div></div></aside></main>'
    + '<nav class="sc-ctrl" aria-label="Presenter controls"><button id="bPrev" type="button">\u2190 Back</button><button id="bNext" type="button">Next \u2192</button><button id="bVotes" type="button">Show votes (V)</button><button id="bAns" type="button">Show answer (A)</button><button id="bAsk" type="button">Questions (Q)</button><span class="sp"></span><button id="bExp" type="button">Export results</button><button id="bReset" type="button">Reset</button></nav>'
    + '<div class="overlay" id="ov"><h2>Your questions</h2><div class="olist" id="olist"></div></div></div>';
  if(bannerMsg) showBanner(bannerMsg);
  const go = d => put('cur', Math.max(0, Math.min(STEPS.length - 1, curIndex() + d)));
  document.getElementById('bPrev').onclick = () => go(-1);
  document.getElementById('bNext').onclick = () => go(1);
  document.getElementById('bVotes').onclick = () => { const q = STEPS[curIndex()]; flag('rv:' + q.id) ? del('rv:' + q.id) : put('rv:' + q.id, 1); };
  document.getElementById('bAns').onclick = () => { const q = STEPS[curIndex()]; flag('ra:' + q.id) ? del('ra:' + q.id) : put('ra:' + q.id, 1); };
  document.getElementById('bAsk').onclick = () => { showAsk = !showAsk; render(); };
  document.getElementById('bExp').onclick = exportResults;
  document.getElementById('bReset').onclick = () => { if((prompt('This clears every vote and answer for everyone. Type RESET to confirm.') || '').trim() === 'RESET') wipe(); };
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); go(1); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(-1); }
    else if(e.key === 'v' || e.key === 'V') document.getElementById('bVotes').click();
    else if(e.key === 'a' || e.key === 'A') document.getElementById('bAns').click();
    else if(e.key === 'q' || e.key === 'Q' || (e.key === 'Escape' && showAsk)) document.getElementById('bAsk').click();
  });
}
function drawQR(){
  if(qrDone) return; const el = document.getElementById('qr'); if(!el) return;
  if(typeof QRCode !== 'undefined'){ new QRCode(el, { text: location.origin + location.pathname, width: 216, height: 216, colorDark: '#003B37', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); qrDone = true; }
  else el.innerHTML = '<span style="color:#0F2E2A;font-size:16px">QR code unavailable. Use the link below.</span>';
}
function renderScreen(){
  if(!document.getElementById('stage')) screenShell();
  drawQR();
  const i = curIndex(), q = STEPS[i], st = document.getElementById('stage');
  document.getElementById('prog').textContent = (i + 1) + ' of ' + STEPS.length;
  const hasVotes = ['single','multi','scale','example'].includes(q.type);
  const bv = document.getElementById('bVotes'), ba = document.getElementById('bAns');
  bv.style.display = q.type === 'example' ? '' : 'none'; bv.classList.toggle('on', flag('rv:' + q.id));
  ba.style.display = q.answer !== undefined ? '' : 'none'; ba.classList.toggle('on', flag('ra:' + q.id));
  document.getElementById('bAsk').classList.toggle('on', showAsk);
  const cnt = document.getElementById('cnt'), cntl = document.getElementById('cntl');
  if(hasVotes){ const v = voters(q); cnt.textContent = v; cntl.textContent = v === 1 ? 'person has voted' : 'people have voted'; }
  else if(q.type === 'open'){ const n = texts(q.id).length; cnt.textContent = n; cntl.textContent = n === 1 ? 'answer' : 'answers'; }
  else { const n = texts(ASK_ID).length; cnt.textContent = n; cntl.textContent = n === 1 ? 'question asked' : 'questions asked'; }

  let h = '<p class="sc-sec">' + esc(q.sec) + '</p>';
  if(q.type === 'note'){
    h += '<h1 class="sc-q">' + esc(q.title) + '</h1>';
    if(q.body) h += '<p class="sc-body">' + esc(q.body) + '</p>';
    if(q.bullets) h += '<ul class="sc-note-b">' + q.bullets.map(b => '<li><b>' + esc(b[0]) + '</b>' + esc(b[1]) + '</li>').join('') + '</ul>';
    if(q.foot) h += '<p class="sc-foot">' + esc(q.foot) + '</p>';
  } else if(q.type === 'roadmap'){
    h += '<h1 class="sc-q">' + esc(q.title) + '</h1><div class="road">' + q.cols.map(c => '<div class="' + c.tone + '"><div class="w">' + esc(c.when) + '</div><span class="t">' + esc(c.tag) + '</span><div class="i">' + c.items.map(esc).join('<br>') + '</div></div>').join('') + '</div>';
  } else if(q.type === 'open'){
    h += '<h1 class="sc-q">' + esc(q.q) + '</h1>' + wallHTML(texts(q.id));
  } else {
    h += q.type === 'example' ? '<p class="sc-hint">Good use or bad use?</p><h1 class="sc-scn">' + esc(q.q) + '</h1>' : '<h1 class="sc-q">' + esc(q.q) + '</h1>' + (q.hint ? '<p class="sc-hint">' + esc(q.hint) + '</p>' : '');
    const hide = q.type === 'example' && !flag('rv:' + q.id);
    h += hide ? '<p class="hidden-v">Votes hidden until reveal.</p>' : barsHTML(q);
    if(flag('ra:' + q.id)){
      const ok = q.type === 'example' ? (q.answer === 0 ? 'Good use.' : 'Bad use.') : q.opts[q.answer] + '.';
      h += '<div class="answer' + (q.type === 'example' && q.answer === 1 ? ' bad' : '') + '"><b>' + esc(ok) + '</b> ' + esc(q.why || '') + '</div>';
    }
  }
  st.innerHTML = h;
  requestAnimationFrame(() => st.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w));
  const ov = document.getElementById('ov'); ov.classList.toggle('open', showAsk);
  if(showAsk){ const t = texts(ASK_ID); document.getElementById('olist').innerHTML = t.length ? t.map(o => '<div>' + esc(o.v) + '</div>').join('') : '<p class="sc-empty">No questions yet. They\u2019ll appear here as people send them.</p>'; }
}
function barsHTML(q){
  const c = counts(q), tot = c.reduce((a,b) => a+b, 0), L = labels(q), ans = flag('ra:' + q.id) ? q.answer : undefined;
  let h = '<div class="bars">';
  L.forEach((l, i) => {
    const p = tot ? Math.round(c[i] / tot * 100) : 0;
    const cls = ans === undefined ? '' : (i === ans ? ' correct' : ' dim');
    h += '<div class="bar' + cls + '"><div class="bar-top"><span>' + esc(l) + '</span><span class="n">' + (tot ? p + '%' : '') + '</span></div><div class="track"><div class="fill" data-w="' + p + '%"></div></div>'
      + (q.compare ? '<div class="cmp" data-w="' + q.compare.pct[i] + '%"></div>' : '') + '</div>';
  });
  h += '</div>';
  if(q.compare) h += '<p class="cmp-key">Thin line: ' + esc(q.compare.label) + '</p>';
  return h;
}
function wallHTML(items){
  if(!items.length) return '<p class="sc-empty">No answers yet. They\u2019ll appear here as people send them.</p>';
  const m = {}; items.forEach(o => { const k = o.v.toLowerCase().replace(/\s+/g,' ').trim().replace(/[.!?,;:]+$/,''); (m[k] = m[k] || {t: o.v, n: 0}).n++; });
  return '<div class="wall">' + Object.values(m).sort((a,b) => b.n - a.n).map(o => '<span>' + esc(o.t) + (o.n > 1 ? '<i>\u00d7' + o.n + '</i>' : '') + '</span>').join('') + '</div>';
}
function exportResults(){
  const L = ['Greener Edge, ' + SESSION, 'Session results, exported ' + new Date().toLocaleString('en-GB'), ''];
  let sec = '';
  STEPS.forEach(q => {
    if(q.sec !== sec){ sec = q.sec; L.push('== ' + sec + ' ==', ''); }
    if(q.type === 'note' || q.type === 'roadmap') return;
    L.push(q.q);
    if(q.type === 'open'){ const t = texts(q.id); if(!t.length) L.push('  (no answers)'); t.forEach(o => L.push('  - ' + o.v)); }
    else { const c = counts(q), tot = c.reduce((a,b) => a+b, 0); L.push('  (' + voters(q) + ' people, ' + tot + ' votes)'); labels(q).forEach((l,i) => L.push('  - ' + l + ': ' + c[i] + ' (' + (tot ? Math.round(c[i]/tot*100) : 0) + '%)')); }
    L.push('');
  });
  L.push('== Questions from the room ==', ''); const a = texts(ASK_ID); if(!a.length) L.push('  (none)'); a.forEach(o => L.push('  - ' + o.v));
  const blob = new Blob([L.join('\n')], {type: 'text/plain'}); const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href = url; link.download = 'ge_oct2026_results.txt'; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function render(){ isScreen ? renderScreen() : renderPhone(); }
render(); start();
})();
</script>
