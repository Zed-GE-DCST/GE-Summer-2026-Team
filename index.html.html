<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greener Edge — Summer 2026 Team Meeting</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>html,body{margin:0; padding:24px 0; background:#f4f1e6;}</style>
</head>
<body>
<div id="ge-board">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap');

  #ge-board{
    --teal:#00544F; --teal-bg:#08554F; --lime:#85BE00; --lime-soft:#dcebb0;
    --cream:#f4f1e6; --paper:#fffdf6; --ink:#0f3a35; --muted:#5e7a73; --line:#e2dccb;
    --gold:#d6a93d; --clay:#b9572f; --midteal:#3f9183; --olive:#6b8f3a;
    --lime-tint:#eaf2d4; --teal-tint:#d7e6e3;
    font-family:'Hanken Grotesk',sans-serif; color:var(--ink); background:var(--cream);
    background-image:radial-gradient(circle at 10% 12%,rgba(133,190,0,0.10),transparent 42%),
                     radial-gradient(circle at 93% 4%,rgba(0,84,79,0.08),transparent 40%);
    border-radius:16px; overflow:hidden; max-width:1040px; margin:0 auto;
  }
  #ge-board *{box-sizing:border-box;}

  .gb-header{padding:24px 32px 24px; background:var(--teal-bg); color:#eef6ef; position:relative; min-height:150px;}
  .gb-head-main{max-width:calc(100% - 210px);}
  .gb-logo{position:absolute; right:30px; bottom:22px; height:56px; width:auto; display:block;}
  .gb-title{font-family:'Fraunces',serif; font-weight:800; font-size:29px; line-height:1.05; margin:0 0 3px; color:#fff;}
  .gb-sub{font-size:13.5px; color:#bcd4cf;}
  .gb-dates{font-size:12px; color:var(--lime); font-weight:700; letter-spacing:.05em; margin-top:3px;}
  .gb-live{position:absolute; top:26px; right:30px; display:flex; align-items:center; gap:7px; font-size:12px; color:#bcd4cf;}
  .gb-dot{width:9px; height:9px; border-radius:50%; background:var(--lime); animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(133,190,0,.5);}70%{box-shadow:0 0 0 8px rgba(133,190,0,0);}100%{box-shadow:0 0 0 0 rgba(133,190,0,0);}}

  .gb-nav{display:flex; gap:6px; padding:11px 32px; background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap;}
  .gb-nav button{font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); background:transparent; border:1px solid transparent; padding:7px 14px; border-radius:20px; cursor:pointer; transition:all .15s;}
  .gb-nav button:hover{color:var(--teal);}
  .gb-nav button.active{background:var(--lime-tint); color:var(--teal);}

  .gb-body{padding:22px 32px 36px;}
  .gb-section{display:none;}
  .gb-section.active{display:block; animation:fade .3s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}
  .gb-stitle{font-family:'Fraunces',serif; font-size:14px; letter-spacing:.05em; text-transform:uppercase; color:var(--clay); margin:0 0 2px; font-weight:600;}

  .gb-card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:22px; margin:16px 0; box-shadow:0 2px 0 rgba(0,84,79,.04);}
  .gb-two{display:grid; grid-template-columns:1fr 1fr; gap:26px; align-items:center;}
  .gb-q{font-family:'Fraunces',serif; font-weight:600; font-size:21px; line-height:1.22; margin:0 0 4px; color:var(--teal);}
  .gb-hint{font-size:12.5px; color:var(--muted); margin:0 0 15px;}

  .gb-opts{display:flex; flex-direction:column; gap:9px;}
  .gb-opt{border:1.5px solid var(--line); border-radius:10px; padding:12px 15px; cursor:pointer; font-size:15px; font-weight:500; background:var(--cream); transition:border-color .15s, transform .07s, background .15s;}
  .gb-opt:hover{border-color:var(--lime);}
  .gb-opt:active{transform:scale(.99);}
  .gb-opt.picked{border-color:var(--teal); background:var(--lime-tint);}
  .gb-scale{display:flex; gap:8px;}
  .gb-scale .gb-opt{flex:1; text-align:center; font-weight:600;}
  .gb-scale-ends{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:7px;}

  .gb-chart{background:var(--cream); border:1px solid var(--line); border-radius:12px; padding:16px; transition:box-shadow .3s;}
  .gb-chart.bump{box-shadow:0 0 0 3px rgba(133,190,0,.4);}
  .gb-chart-h{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:12px; display:flex; justify-content:space-between;}
  .gb-empty{font-size:13px; color:var(--muted); font-style:italic; padding:8px 2px;}

  /* horizontal bars */
  .gb-bar{margin:9px 0;}
  .gb-bar-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
  .gb-bar-lab{color:var(--ink); font-weight:500; padding-right:8px;}
  .gb-bar-val{font-variant-numeric:tabular-nums; font-weight:700; color:var(--teal); white-space:nowrap;}
  .gb-track{height:14px; background:#ece6d4; border-radius:8px; overflow:hidden;}
  .gb-fill{height:100%; width:0%; border-radius:8px; transition:width .6s cubic-bezier(.2,.7,.3,1);}

  /* donut */
  .gb-donut-wrap{display:flex; align-items:center; gap:16px;}
  .gb-donut{flex:none;}
  .gb-slice{transition:stroke-dasharray .6s cubic-bezier(.2,.7,.3,1), stroke-dashoffset .6s cubic-bezier(.2,.7,.3,1);}
  .gb-legend{display:flex; flex-direction:column; gap:7px; font-size:13px;}
  .gb-leg-row{display:flex; align-items:center; gap:8px;}
  .gb-leg-dot{width:11px; height:11px; border-radius:3px; flex:none;}
  .gb-leg-lab{flex:1;}
  .gb-leg-val{font-variant-numeric:tabular-nums; font-weight:700; color:var(--teal);}

  /* columns (scale) */
  .gb-cols{display:flex; align-items:flex-end; gap:10px; height:128px; padding-top:6px;}
  .gb-colitem{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .gb-colval{font-size:12px; font-weight:700; color:var(--teal); margin-bottom:4px; font-variant-numeric:tabular-nums;}
  .gb-colbar{width:100%; max-width:46px; background:linear-gradient(180deg,var(--lime),var(--olive)); border-radius:7px 7px 0 0; height:0%; transition:height .6s cubic-bezier(.2,.7,.3,1); min-height:3px;}
  .gb-collab{font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}

  /* good/bad */
  .gb-scenario{background:var(--cream); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:9px; padding:13px 15px; font-size:15px; line-height:1.4; margin-bottom:14px;}
  .gb-gb{display:flex; gap:10px;}
  .gb-gb .gb-opt{flex:1; text-align:center; font-weight:700;}
  .gb-gb .gb-opt.good.picked{background:var(--lime-tint); border-color:var(--olive);}
  .gb-gb .gb-opt.bad.picked{background:#f3ddcf; border-color:var(--clay);}
  .gb-reveal-btn{margin-top:14px; font-family:inherit; font-weight:600; font-size:13px; color:var(--teal); background:transparent; border:1px dashed var(--lime); border-radius:8px; padding:9px 14px; cursor:pointer;}
  .gb-reveal-btn:hover{background:var(--lime-tint);}
  .gb-answer{display:none; margin-top:14px; border-radius:10px; padding:13px 15px; font-size:14px; line-height:1.45;}
  .gb-answer.show{display:block; animation:fade .3s ease;}
  .gb-answer.good{background:var(--lime-tint); border:1px solid var(--lime);}
  .gb-answer.bad{background:#f3ddcf; border:1px solid #e0b59c;}
  .gb-answer b{font-family:'Fraunces',serif;}

  /* open + cloud */
  .gb-openwrap{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:14px;}
  .gb-openwrap textarea{flex:1 1 100%; font-family:inherit; font-size:14.5px; border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; resize:vertical; min-height:46px; background:var(--cream); color:var(--ink);}
  .gb-openwrap textarea:focus{outline:none; border-color:var(--lime);}
  .gb-openwrap select{font-family:inherit; font-size:13.5px; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; background:var(--cream); color:var(--ink);}
  .gb-send{font-family:inherit; font-weight:600; font-size:14px; color:#fff; background:var(--lime); border:none; border-radius:10px; padding:0 22px; height:42px; cursor:pointer; transition:background .15s;}
  .gb-send:hover{background:#74a800;}
  .gb-group-h{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--clay); font-weight:700; margin:14px 0 8px;}
  .gb-cloud{display:flex; flex-wrap:wrap; gap:9px; align-items:center;}
  .gb-chip{background:var(--lime-tint); border:1px solid #cfe0a8; color:var(--teal); border-radius:20px; padding:6px 13px; line-height:1.2; font-weight:600; animation:fade .3s ease; display:inline-flex; align-items:center; gap:7px;}
  .gb-chip .gb-cnt{font-size:11px; background:var(--teal); color:#fff; border-radius:10px; padding:1px 7px; font-weight:700;}

  .gb-other{margin-top:12px;}
  .gb-other-btn{font-family:inherit; font-weight:600; font-size:13.5px; color:var(--teal); background:transparent; border:1.5px dashed var(--line); border-radius:10px; padding:11px 15px; width:100%; cursor:pointer;}
  .gb-other-btn:hover{border-color:var(--lime);}
  .gb-other-box{display:none; gap:9px; margin-top:9px;}
  .gb-other-box.show{display:flex;}
  .gb-other-box input{flex:1; font-family:inherit; font-size:14px; border:1.5px solid var(--line); border-radius:10px; padding:10px 13px; background:var(--cream);}

  .gb-foot{display:flex; justify-content:space-between; align-items:center; padding:14px 32px 18px; border-top:1px solid var(--line); background:var(--paper); flex-wrap:wrap; gap:10px;}
  .gb-foot-note{font-size:12px; color:var(--muted); max-width:560px;}
  .gb-mini{font-family:inherit; font-size:12px; font-weight:600; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer;}
  .gb-mini:hover{color:var(--teal); border-color:var(--lime);}
  .gb-banner{display:none; margin:14px 32px 0; padding:10px 14px; background:#fbe6cf; border:1px solid #e7c389; border-radius:10px; font-size:12.5px; color:#7a531a;}
  .gb-ov{display:none; position:fixed; inset:0; background:rgba(15,58,53,.45); z-index:50; align-items:center; justify-content:center; padding:24px;}
  .gb-ov-card{background:var(--paper); border-radius:14px; padding:20px; width:min(640px,100%); max-height:84vh; display:flex; flex-direction:column; box-shadow:0 18px 50px rgba(0,0,0,.3);}
  .gb-ov-h{font-family:'Fraunces',serif; font-size:18px; font-weight:700; color:var(--teal); margin-bottom:12px;}
  .gb-ov-ta{flex:1; min-height:300px; font-family:monospace; font-size:12px; line-height:1.5; border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--cream); color:var(--ink); resize:vertical;}
  .gb-ov-btns{display:flex; gap:8px; margin-top:12px; justify-content:flex-end; flex-wrap:wrap;}

  @media (max-width:680px){ .gb-two{grid-template-columns:1fr; gap:16px;} .gb-title{font-size:23px;} .gb-scale{flex-wrap:wrap;} .gb-donut-wrap{flex-direction:column; align-items:flex-start;} .gb-header{min-height:0;} .gb-head-main{max-width:none;} .gb-logo{position:static; margin-top:16px; height:48px;} }
</style>

  document.getElementById('gb-dates').textContent=META.dates;

  function initBackend(){
    const ok = (typeof firebase!=='undefined') && firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('PASTE')===-1;
    if(ok){
      try{
        firebase.initializeApp(firebaseConfig);
        fdb = firebase.database();
        usingFirebase = true;
        fdb.ref('board').on('value', function(snap){ cache = snap.val() || {}; refreshAll(); });
      }catch(e){ usingFirebase=false; flagLocal('Could not connect to Firebase. Check your config, especially databaseURL. Running in local test mode for now.'); }
    } else {
      flagLocal('No Firebase config yet. Paste your config at the top to go live. Running in local test mode for now.');
    }
  }
  async function sList(p){ const src = usingFirebase?cache:localStore; return Object.keys(src).filter(function(k){return k.indexOf(p)===0;}); }
  async function sGet(k){ const src = usingFirebase?cache:localStore; return (src[k]!==undefined&&src[k]!==null)?src[k]:null; }
  async function sSet(k,v){ if(usingFirebase){ cache[k]=v; try{ await fdb.ref('board/'+k).set(v); }catch(e){} } else { localStore[k]=v; } }
  async function sDel(k){ if(usingFirebase){ delete cache[k]; try{ await fdb.ref('board/'+k).remove(); }catch(e){} } else { delete localStore[k]; } }
  function flagLocal(msg){ usingFirebase=false; const b=document.getElementById('gb-banner'); b.style.display='block'; b.textContent = msg || 'Running in local test mode.'; }

  const nav=document.getElementById('gb-nav'), body=document.getElementById('gb-body');
  SECTIONS.forEach((s,i)=>{
    const b=document.createElement('button'); b.textContent=s.label; b.dataset.sec=s.id; if(!i)b.classList.add('active');
    b.onclick=()=>showSec(s.id); nav.appendChild(b);
    const sec=document.createElement('div'); sec.className='gb-section'+(i?'':' active'); sec.id='sec-'+s.id;
    sec.innerHTML='<div class="gb-stitle">'+s.title+'</div>'; s.qs.forEach(q=>sec.appendChild(buildCard(q))); body.appendChild(sec);
  });
  function showSec(id){ document.querySelectorAll('.gb-section').forEach(e=>e.classList.toggle('active',e.id==='sec-'+id)); nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.sec===id)); }

  function donutSkeleton(n,colors){
    let slices='';
    for(let i=0;i<n;i++){ slices+='<circle class="gb-slice" id="sl-'+i+'" r="44" cx="60" cy="60" fill="none" stroke="'+colors[i%colors.length]+'" stroke-width="18" stroke-dasharray="0 '+C+'" stroke-dashoffset="0"></circle>'; }
    return '<div class="gb-donut-wrap"><svg class="gb-donut" width="132" height="132" viewBox="0 0 120 120">'
      +'<circle r="44" cx="60" cy="60" fill="none" stroke="#ece6d4" stroke-width="18"></circle>'
      +'<g transform="rotate(-90 60 60)">'+slices+'</g>'
      +'<text id="dtot" x="60" y="58" text-anchor="middle" font-family="Fraunces,serif" font-weight="800" font-size="22" fill="#00544F">0</text>'
      +'<text x="60" y="74" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="9" fill="#5e7a73">votes</text>'
      +'</svg><div class="gb-legend" id="leg"></div></div>';
  }

  function buildCard(q){
    const card=document.createElement('div'); card.className='gb-card'; card.id='card-'+q.id;

    if(q.type==='open'){
      let h='<div class="gb-q">'+q.q+'</div>'+(q.hint?'<div class="gb-hint">'+q.hint+'</div>':'');
      h+='<div class="gb-openwrap">';
      if(q.tags){ h+='<select id="tag-'+q.id+'"><option value="">Choose a theme\u2026</option>'+q.tags.map(t=>'<option>'+t+'</option>').join('')+'<option>Other</option></select>'; }
      h+='<textarea id="ta-'+q.id+'" placeholder="Your answer\u2026"></textarea><button class="gb-send" data-q="'+q.id+'">Send</button></div>';
      h+='<div id="wall-'+q.id+'"></div>'; card.innerHTML=h;
      card.querySelector('.gb-send').onclick=()=>submitOpen(q); return card;
    }

    if(q.type==='example'){
      card.innerHTML='<div class="gb-two"><div><div class="gb-scenario">'+q.q+'</div>'
        +'<div class="gb-gb"><div class="gb-opt good" data-opt="0">Good use</div><div class="gb-opt bad" data-opt="1">Bad use</div></div>'
        +'<button class="gb-reveal-btn" data-rev="'+q.id+'">Reveal answer</button>'
        +'<div class="gb-answer '+q.answer+'" id="ans-'+q.id+'"><b>'+(q.answer==='good'?'Good use.':'Bad use.')+'</b> '+q.why+'</div></div>'
        +'<div class="gb-chart" id="chart-'+q.id+'">'+donutSkeleton(2,['#85BE00','#b9572f'])+'</div></div>';
      card.querySelectorAll('.gb-opt').forEach(el=>el.onclick=()=>castVote(q,parseInt(el.dataset.opt,10)));
      card.querySelector('[data-rev]').onclick=()=>document.getElementById('ans-'+q.id).classList.toggle('show');
      return card;
    }

    // single / multi / scale
    let left='<div class="gb-q">'+q.q+'</div>'+(q.hint?'<div class="gb-hint">'+q.hint+'</div>':'');
    const n = q.type==='scale'?5:q.opts.length;
    if(q.type==='scale'){
      left+='<div class="gb-scale">'; for(let i=0;i<5;i++) left+='<div class="gb-opt" data-opt="'+i+'">'+(i+1)+'</div>'; left+='</div>';
      left+='<div class="gb-scale-ends"><span>'+q.ends[0]+'</span><span>'+q.ends[1]+'</span></div>';
    } else {
      left+='<div class="gb-opts">'; q.opts.forEach((o,i)=>left+='<div class="gb-opt" data-opt="'+i+'">'+o+'</div>'); left+='</div>';
      if(q.other){ left+='<div class="gb-other"><button class="gb-other-btn" data-other="'+q.id+'">+ Add your own</button>'
        +'<div class="gb-other-box" id="obox-'+q.id+'"><input id="oin-'+q.id+'" placeholder="Your idea\u2026"><button class="gb-send" data-osend="'+q.id+'">Add</button></div></div>'; }
    }

    let chartInner='';
    if(q.chart==='pie'){ chartInner=donutSkeleton(n,PAL); }
    else if(q.chart==='column'){ let cols=''; for(let i=0;i<5;i++) cols+='<div class="gb-colitem"><div class="gb-colval" id="cv-'+q.id+'-'+i+'"></div><div class="gb-colbar" id="cb-'+q.id+'-'+i+'"></div><div class="gb-collab">'+(i+1)+'</div></div>'; chartInner='<div class="gb-cols">'+cols+'</div>'; }
    else { let bars=''; for(let i=0;i<n;i++){ bars+='<div class="gb-bar"><div class="gb-bar-top"><span class="gb-bar-lab">'+q.opts[i]+'</span><span class="gb-bar-val" id="bv-'+q.id+'-'+i+'"></span></div><div class="gb-track"><div class="gb-fill" id="bf-'+q.id+'-'+i+'" style="background:'+PAL[i%PAL.length]+'"></div></div></div>'; } chartInner=bars; }

    card.innerHTML='<div class="gb-two"><div>'+left+'</div><div class="gb-chart" id="chart-'+q.id+'"><div class="gb-chart-h"><span>Live results</span><span id="ct-'+q.id+'"></span></div>'+chartInner+'<div id="extra-'+q.id+'"></div></div></div>';
    card.querySelectorAll('.gb-opt').forEach(el=>el.onclick=()=>castVote(q,parseInt(el.dataset.opt,10)));
    if(q.other){ card.querySelector('[data-other]').onclick=()=>document.getElementById('obox-'+q.id).classList.toggle('show'); card.querySelector('[data-osend]').onclick=()=>submitOther(q.id); }
    return card;
  }

  async function castVote(q,idx){
    const multi=(q.type==='multi'); myVotes[q.id]=myVotes[q.id]||{};
    const ex=myVotes[q.id][idx];
    if(ex){ await sDel(ex); delete myVotes[q.id][idx]; }
    else{ if(!multi){ for(const k in myVotes[q.id]) await sDel(myVotes[q.id][k]); myVotes[q.id]={}; } const key='v:'+q.id+':'+idx+':'+uid(); await sSet(key,'1'); myVotes[q.id][idx]=key; }
    markPicked(q); renderQ(q);
  }
  function markPicked(q){ const c=document.getElementById('card-'+q.id); c.querySelectorAll('.gb-opt').forEach(el=>{const i=parseInt(el.dataset.opt,10); el.classList.toggle('picked',!!(myVotes[q.id]&&myVotes[q.id][i]));}); }

  async function submitOpen(q){ const ta=document.getElementById('ta-'+q.id); const t=(ta.value||'').trim(); if(!t)return; let tag=''; if(q.tags){const s=document.getElementById('tag-'+q.id); tag=s.value||'General';} await sSet('s:'+q.id+':'+uid(), tag+'\u0001'+t.slice(0,200)); ta.value=''; if(q.tags)document.getElementById('tag-'+q.id).value=''; renderWall(q); }
  async function submitOther(qid){ const inp=document.getElementById('oin-'+qid); const t=(inp.value||'').trim(); if(!t)return; await sSet('o:'+qid+':'+uid(), t.slice(0,120)); inp.value=''; renderQ(allQ.find(x=>x.id===qid)); }

  function cloudHTML(items){
    if(!items.length) return '<div class="gb-empty">No answers yet. Be the first.</div>';
    const max=Math.max.apply(null,items.map(o=>o.count));
    return '<div class="gb-cloud">'+items.map(o=>{
      const px = max<=1 ? 14 : Math.round(14+(o.count-1)/(max-1)*14);
      return '<span class="gb-chip" style="font-size:'+px+'px">'+esc(o.text)+(o.count>1?'<span class="gb-cnt">'+o.count+'</span>':'')+'</span>';
    }).join('')+'</div>';
  }
  function tally(texts){ const m={}; texts.forEach(t=>{const k=norm(t); if(!m[k])m[k]={text:t,count:0}; m[k].count++;}); return Object.values(m).sort((a,b)=>b.count-a.count); }

  async function renderQ(q){
    if(q.type==='open') return renderWall(q);
    const n=q.type==='scale'?5:q.type==='example'?2:q.opts.length;
    const keys=await sList('v:'+q.id+':'); const counts=new Array(n).fill(0);
    keys.forEach(k=>{const i=parseInt(k.split(':')[2],10); if(i>=0&&i<n)counts[i]++;});
    const total=counts.reduce((a,b)=>a+b,0);
    const card=document.getElementById('card-'+q.id);
    const ct=document.getElementById('ct-'+q.id); if(ct) ct.textContent=(total||0)+(q.type==='multi'?' picks':' votes');

    if(q.type==='example' || q.chart==='pie'){
      const chart=document.getElementById('chart-'+q.id);
      const dt=chart.querySelector('#dtot'); if(dt) dt.textContent=total;
      let cum=0; const labels = q.type==='example'?['Good use','Bad use']:q.opts;
      const colors = q.type==='example'?['#85BE00','#b9572f']:PAL;
      for(let i=0;i<n;i++){ const frac=total?counts[i]/total:0; const len=frac*C; const sl=chart.querySelector('#sl-'+i); if(sl){ sl.setAttribute('stroke-dasharray', len+' '+(C-len)); sl.setAttribute('stroke-dashoffset', -cum); } cum+=len; }
      const leg=chart.querySelector('#leg'); if(leg){ leg.innerHTML=labels.map((l,i)=>{const pct=total?Math.round(counts[i]/total*100):0; return '<div class="gb-leg-row"><span class="gb-leg-dot" style="background:'+colors[i%colors.length]+'"></span><span class="gb-leg-lab">'+l+'</span><span class="gb-leg-val">'+counts[i]+' \u00b7 '+pct+'%</span></div>';}).join(''); }
    } else if(q.chart==='column'){
      for(let i=0;i<5;i++){ const pct=total?Math.round(counts[i]/total*100):0; const cb=document.getElementById('cb-'+q.id+'-'+i); const cv=document.getElementById('cv-'+q.id+'-'+i); if(cb)cb.style.height=pct+'%'; if(cv)cv.textContent=counts[i]||''; }
    } else {
      for(let i=0;i<n;i++){ const pct=total?Math.round(counts[i]/total*100):0; const bf=document.getElementById('bf-'+q.id+'-'+i); const bv=document.getElementById('bv-'+q.id+'-'+i); if(bf)bf.style.width=pct+'%'; if(bv)bv.textContent=total?(counts[i]+' \u00b7 '+pct+'%'):''; }
    }

    if(q.other){ const ex=document.getElementById('extra-'+q.id); const ok=await sList('o:'+q.id+':'); if(ok.length){ const arr=[]; for(const k of ok){const v=await sGet(k); if(v)arr.push(v);} ex.innerHTML='<div class="gb-group-h">Also suggested</div>'+cloudHTML(tally(arr)); } else if(ex){ ex.innerHTML=''; } }

    const chartBox=document.getElementById('chart-'+q.id);
    if(prevTotals[q.id]!==undefined && total>prevTotals[q.id]){ chartBox.classList.add('bump'); setTimeout(()=>chartBox.classList.remove('bump'),500); }
    prevTotals[q.id]=total;
  }

  async function renderWall(q){
    const wall=document.getElementById('wall-'+q.id); if(!wall) return;
    const keys=await sList('s:'+q.id+':');
    if(!keys.length){ wall.innerHTML='<div class="gb-empty">No answers yet. Be the first.</div>'; return; }
    const items=[]; for(const k of keys){ const v=await sGet(k); if(v){ const idx=v.indexOf('\u0001'); items.push(idx>=0?{tag:v.slice(0,idx),text:v.slice(idx+1)}:{tag:'',text:v}); } }
    if(!q.tags){ wall.innerHTML=cloudHTML(tally(items.map(o=>o.text))); return; }
    const groups={}; items.forEach(o=>{const t=o.tag||'General'; (groups[t]=groups[t]||[]).push(o.text);});
    const order=[...q.tags,'Other','General'].filter(t=>groups[t]);
    wall.innerHTML=order.map(t=>'<div><div class="gb-group-h">'+esc(t)+' ('+groups[t].length+')</div>'+cloudHTML(tally(groups[t]))+'</div>').join('');
  }

  async function refreshAll(){ for(const q of allQ) await renderQ(q); }
  document.getElementById('gb-refresh').onclick=refreshAll;
  document.getElementById('gb-reset').onclick=async()=>{
    if(!confirm('Clear all votes and answers for everyone? This cannot be undone.')) return;
    if(usingFirebase){ cache={}; try{ await fdb.ref('board').remove(); }catch(e){} } else { localStore={}; }
    for(const k in myVotes) delete myVotes[k];
    document.querySelectorAll('.gb-opt').forEach(e=>e.classList.remove('picked'));
    document.querySelectorAll('.gb-answer').forEach(e=>e.classList.remove('show'));
    refreshAll();
  };
  document.getElementById('gb-export').onclick=exportResults;
  async function exportResults(){
    const L=[];
    L.push('Greener Edge \u2014 '+META.title);
    L.push('Session board results \u2014 exported '+new Date().toLocaleString());
    for(const s of SECTIONS){
      L.push(''); L.push('== '+s.title+' ==');
      for(const q of s.qs){
        L.push(''); L.push(q.q);
        if(q.type==='open'){
          const keys=await sList('s:'+q.id+':'); const items=[];
          for(const k of keys){ const v=await sGet(k); if(v){ const idx=v.indexOf('\u0001'); items.push(idx>=0?{tag:v.slice(0,idx),text:v.slice(idx+1)}:{tag:'',text:v}); } }
          if(!items.length){ L.push('  (no answers)'); }
          else if(q.tags){ const g={}; items.forEach(o=>{const t=o.tag||'General';(g[t]=g[t]||[]).push(o.text);}); [...q.tags,'Other','General'].filter(t=>g[t]).forEach(t=>{ L.push('  ['+t+']'); g[t].forEach(x=>L.push('   - '+x)); }); }
          else { items.forEach(o=>L.push('  - '+o.text)); }
        } else {
          const n=q.type==='scale'?5:q.type==='example'?2:q.opts.length;
          const keys=await sList('v:'+q.id+':'); const counts=new Array(n).fill(0);
          keys.forEach(k=>{const i=parseInt(k.split(':')[2],10); if(i>=0&&i<n)counts[i]++;});
          const total=counts.reduce((a,b)=>a+b,0);
          const labels=q.type==='scale'?['1','2','3','4','5']:q.type==='example'?['Good use','Bad use']:q.opts;
          L.push('  ('+total+(q.type==='multi'?' picks)':' votes)'));
          for(let i=0;i<n;i++){ const pct=total?Math.round(counts[i]/total*100):0; L.push('  - '+labels[i]+': '+counts[i]+' ('+pct+'%)'); }
          if(q.other){ const ok=await sList('o:'+q.id+':'); if(ok.length){ L.push('  Also suggested:'); for(const k of ok){const v=await sGet(k); if(v)L.push('   - '+v);} } }
        }
      }
    }
    showExport(L.join('\n'));
  }
  function showExport(text){
    let ov=document.getElementById('gb-ov'); if(!ov){ ov=document.createElement('div'); ov.id='gb-ov'; ov.className='gb-ov'; document.getElementById('ge-board').appendChild(ov); }
    ov.innerHTML='<div class="gb-ov-card"><div class="gb-ov-h">Session results</div><textarea class="gb-ov-ta" id="gb-ov-ta" readonly></textarea><div class="gb-ov-btns"><button class="gb-send" id="gb-ov-copy">Copy</button><button class="gb-mini" id="gb-ov-dl">Download .txt</button><button class="gb-mini" id="gb-ov-close">Close</button></div></div>';
    document.getElementById('gb-ov-ta').value=text; ov.style.display='flex';
    document.getElementById('gb-ov-copy').onclick=()=>{ navigator.clipboard.writeText(text).then(()=>{const b=document.getElementById('gb-ov-copy'); b.textContent='Copied'; setTimeout(()=>b.textContent='Copy',1200);}).catch(()=>{const ta=document.getElementById('gb-ov-ta'); ta.select();}); };
    document.getElementById('gb-ov-dl').onclick=()=>{ try{ const blob=new Blob([text],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ge_session_results.txt'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ alert('Download blocked here, use Copy instead.'); } };
    document.getElementById('gb-ov-close').onclick=()=>{ ov.style.display='none'; };
  }
  initBackend();
  refreshAll(); setInterval(refreshAll,4000);
})();
</script>
</div>
